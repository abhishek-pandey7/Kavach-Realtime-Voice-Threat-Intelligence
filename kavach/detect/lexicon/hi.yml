  - आरबीआई अकाउंट
  - जुर्माना
  - re:फाइन (?:भर|जमा|देना)
  - सिक्योरिटी डिपॉजिट
  - प्रोसेसिंग फीस
  - रजिस्ट्रेशन फीस
  - गिफ्ट कार्ड
  - re:क्यू ?आर कोड
  - re:paise? (?:transfer|bhej)
