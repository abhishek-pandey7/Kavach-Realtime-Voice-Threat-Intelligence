payment_demand:
  - re:पैसे? (?:ट्रांसफर|भेज)
  - re:(?:रकम|राशि|अमाउंट) (?:ट्रांसफर|भेज|जमा)
  # Imperatives only: "कॉल ट्रांसफर कर रहा हूं" (transferring the call) is not a payment demand.
  - re:ट्रांसफर (?:कीजिए|करो|करें|कर दीजिए|कर दो|करना होगा)
  - वेरिफिकेशन के लिए
  - वेरिफिकेशन अमाउंट
  - सेफ अकाउंट
