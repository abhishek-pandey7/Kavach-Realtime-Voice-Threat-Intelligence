# Hindi red-flag phrases, in Devanagari (Prisma hi-IN output) and Latin
# (Hinglish, Prisma en-IN output). English loanwords are written the way
# Prisma transcribes them ("पार्सल", "ड्रग्स").
#
# Phrases are normalised the same way as transcripts (lowercase, no nukta,
# chandrabindu -> anusvara) and spaces match optional whitespace, so
# "सी बी आई" also matches "सीबीआई". Entries starting with "re:" are regexes.

hook:
  - पार्सल
  - कूरियर
  - कुरियर
  - पैकेज
  - केवाईसी
  - के वाई सी
  - रिफंड
  - गलती से पैसे
  - बिजली का बिल
  - बिजली बिल
  - parcel
  - courier
  - kyc
  - galti se paise

